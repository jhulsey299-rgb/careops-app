<!DOCTYPE html>
<html>
<head>
  <title>CareOps SQL Analyst</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

  <div class="left">
    <h2>Schema Explorer</h2>
  </div>

  <div class="main">
    <h1>CareOps: SQL Analyst</h1>

    <div class="dashboard">
      <div id="progress-text">0/30 levels completed</div>
      <div id="current-level">Level 1</div>
      <div>Badges: <span id="badges">0</span></div>
    </div>

    <button onclick="resetAllProgress()">Reset Progress</button>

    <div class="level-box">
      <h2 id="level-title"></h2>
      <p id="level-desc"></p>
    </div>

    <textarea id="query"></textarea>

    <div class="buttons">
      <button onclick="runQuery()">Run Query</button>
      <button onclick="checkAnswer()">Check Answer</button>
      <button onclick="prevLevel()">Previous</button>
      <button onclick="nextLevel()">Next</button>
    </div>

    <div id="output"></div>
  </div>

  <div class="right">
    <h3>Levels</h3>
    <div id="levels-panel"></div>
  </div>

</div>

<script src="/static/app.js?v=5"></script>

</body>
</html>
